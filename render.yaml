# Render Blueprint. Create the service with New > Blueprint and point it at this
# repository; Render reads this file and prompts for every value marked
# `sync: false`.
#
# There is no database here on purpose. Render's managed offering is PostgreSQL
# and this app is MySQL (drizzle.config.ts sets dialect: "mysql", the driver is
# mysql2), so DATABASE_URL has to point at MySQL hosted elsewhere — PlanetScale,
# Aiven, Railway, or your own.
services:
  - type: web
    name: notepad-ai
    runtime: node
    plan: free
    # corepack pins pnpm to the version in package.json's packageManager field
    # rather than whatever Render ships.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    # The server serves the client bundle, so the root path is a real check that
    # the process is up and the build landed.
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      # Render assigns PORT and routes to exactly it. The server binds that port
      # and exits rather than drifting to another one, so leave this unset.

      # --- secrets: Render prompts for these on first deploy ---

      # MySQL connection string. See the note at the top of this file.
      - key: DATABASE_URL
        sync: false

      # Signs session cookies, and derives the key that encrypts two-step
      # verification secrets at rest. Keep it stable — rotating it signs
      # everyone out and invalidates every authenticator enrolment.
      - key: JWT_SECRET
        generateValue: true

      # Token exchange and user info, called server-side.
      - key: OAUTH_SERVER_URL
        sync: false

      # --- build-time values ---
      # Anything prefixed VITE_ is compiled into the client bundle during
      # `pnpm build`, not read at runtime. Changing one needs a redeploy, not a
      # restart. If the two OAuth values are missing the client logs a warning
      # and the Sign In button goes nowhere.
      - key: VITE_OAUTH_PORTAL_URL
        sync: false
      - key: VITE_APP_ID
        sync: false

      # --- sign-in methods (all optional; each is offered only when set) ---

      # The absolute origin this app is served from. Left unset, the server
      # falls back to RENDER_EXTERNAL_URL, which Render sets to this service's
      # URL — so a Blueprint deploy works without pasting back a URL that does
      # not exist until the service does. Set it explicitly for a custom domain.
      - key: PUBLIC_ORIGIN
        sync: false

      # Google sign-in. Create an OAuth client of type "Web application" and
      # register this exact redirect URI:
      #   <PUBLIC_ORIGIN>/api/auth/google/callback
      # which on a default Render domain is
      #   https://<service>.onrender.com/api/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # Transactional email, for address confirmation and password reset. Any
      # JSON email API taking {from,to,subject,text} works. Without all three,
      # email sign-up reports itself unavailable rather than accepting
      # registrations whose confirmation link never arrives.
      - key: EMAIL_API_URL
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

      # reCAPTCHA on sign-in, registration and reset. The site key is public and
      # is served to the browser at runtime, so neither of these is a VITE_
      # variable and rotating them needs a restart, not a rebuild.
      - key: RECAPTCHA_SITE_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false

      # --- optional ---

      # How many reverse proxies sit in front of this service, which decides
      # which X-Forwarded-For entry is treated as the client. Render puts
      # exactly one there, which is the default in production, so this only
      # needs setting for something else in front (a CDN: 2) or for nothing at
      # all (0). Getting it too high collapses every visitor into one bucket for
      # rate limiting; too low lets a caller pick their own address.
      - key: TRUSTED_PROXY_HOPS
        value: 1

      # openId granted owner privileges.
      - key: OWNER_OPEN_ID
        sync: false

      # AI provider, called server-side.
      - key: BUILT_IN_FORGE_API_URL
        sync: false
      - key: BUILT_IN_FORGE_API_KEY
        sync: false

      # Records demo deadlines against a hashed visitor id. Leave unset and the
      # 30-minute limit is enforced in the browser only.
      - key: DEMO_LIMIT_SALT
        generateValue: true

      # Encrypted cloud backup. Leave unset and the feature stays hidden.
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      # Only for MinIO, R2 or another S3-compatible endpoint.
      - key: S3_ENDPOINT
        sync: false
