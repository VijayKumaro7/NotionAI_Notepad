name: Security

on:
  pull_request:
  push:
    branches: [main]
  # Advisories are published against code that has not changed. Without a
  # schedule, quiet code is never re-checked and the last CI run's green tick
  # slowly stops meaning anything.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Always printed, whatever the gate below decides. Someone reading a
      # failed run should not have to reproduce it locally to see what failed.
      - name: Report all advisories
        run: pnpm audit || true

      # Critical and high block the merge. Moderate and low are reported above
      # but do not fail, deliberately: a moderate advisory in a transitive
      # dependency of an unrelated package would otherwise wedge every open pull
      # request until someone upstream published a fix, and a gate that blocks
      # work it cannot help with is a gate people learn to switch off.
      #
      # The weekly run above is what catches moderates before they accumulate.
      - name: Fail on critical or high advisories
        run: pnpm audit --audit-level high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Full history, not the default shallow clone. A secret that was committed
      # and then deleted is still in the history, still fetchable by anyone who
      # clones, and still live until it is rotated — scanning only the tip finds
      # exactly the ones that have already been cleaned up.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # This repository has no GitHub Advanced Security, so the platform's own
      # secret scanning and push protection are unavailable. This job is the
      # substitute: it cannot block a push the way push protection does, but it
      # fails the pull request that carries a credential.
      #
      # The binary is pinned by version and checked against the checksum
      # published with the release, so a compromised or swapped artifact fails
      # the job rather than silently scanning nothing.
      - name: Install gitleaks
        env:
          VERSION: 8.28.0
          # sha256 of gitleaks_8.28.0_linux_x64.tar.gz, verified against the
          # artifact this pipeline was written with. A mismatch means the
          # download is not the reviewed binary, and the job stops rather than
          # running whatever arrived.
          SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # --redact so a finding never puts the secret itself into a public CI log,
      # which would turn the alert into a second disclosure.
      - name: Scan the full history
        run: ./gitleaks git --no-banner --redact --log-opts="--all" .

      - name: Scan the working tree
        run: ./gitleaks dir --no-banner --redact .

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only meaningful on a pull request — it diffs the manifest against the base
    # branch, and there is nothing to diff on a push or a schedule.
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      # Catches a newly *introduced* vulnerable dependency even when the
      # advisory is only moderate, which the audit gate lets through. The
      # difference that matters: this one is about a choice made in this pull
      # request, so it is always actionable by its author.
      - name: Review new dependencies
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
