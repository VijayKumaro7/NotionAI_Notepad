name: Security

on:
  pull_request:
  push:
    branches: [main]
  # Advisories are published against code that has not changed. Without a
  # schedule, quiet code is never re-checked and the last CI run's green tick
  # slowly stops meaning anything.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Always printed, whatever the gate below decides. Someone reading a
      # failed run should not have to reproduce it locally to see what failed.
      - name: Report all advisories
        run: pnpm audit || true

      # Critical and high block the merge. Moderate and low are reported above
      # but do not fail, deliberately: a moderate advisory in a transitive
      # dependency of an unrelated package would otherwise wedge every open pull
      # request until someone upstream published a fix, and a gate that blocks
      # work it cannot help with is a gate people learn to switch off.
      #
      # The weekly run above is what catches moderates before they accumulate.
      - name: Fail on critical or high advisories
        run: pnpm audit --audit-level high

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only meaningful on a pull request — it diffs the manifest against the base
    # branch, and there is nothing to diff on a push or a schedule.
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      # Catches a newly *introduced* vulnerable dependency even when the
      # advisory is only moderate, which the audit gate lets through. The
      # difference that matters: this one is about a choice made in this pull
      # request, so it is always actionable by its author.
      - name: Review new dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

# CodeQL is deliberately not a job here.
#
# This repository already has CodeQL *default setup* enabled, which runs its own
# "Analyze (javascript-typescript)" check on every pull request. A workflow
# defining an advanced configuration cannot coexist with that: GitHub refuses
# the upload with "CodeQL job status was configuration error" and reports the
# check as neutral. It was tried, it did exactly that, and a job that can never
# produce a result is worse than no job — it burns minutes and puts a check on
# the pull request that means nothing.
#
# If the advanced configuration is ever wanted — custom query packs, a
# security-extended suite, non-default paths — default setup has to be turned
# off first, under Settings > Advanced Security > Code scanning.
