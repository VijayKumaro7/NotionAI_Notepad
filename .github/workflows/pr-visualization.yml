name: PR visualization

# Keeps docs/PR_BRANCH_VISUALIZATION.md, docs/pr-branch-visualization.html and
# docs/pr-snapshot.json in step with the repository's pull requests. It does not
# push to main: when something changed it commits to one fixed branch and keeps
# a single pull request open from it, so a person still reads and merges the
# result.
#
# Two things to know about that pull request:
#
# - A push made with the workflow's own token does not trigger other workflows,
#   so CI does not run on it. If CI is a required check, the pull request will
#   wait for a manual re-run (close and reopen it, or push from a person's
#   account). It changes documentation only.
# - "Allow GitHub Actions to create and approve pull requests" has to be on
#   under Settings → Actions → General, otherwise the step that opens the pull
#   request fails and says so. The branch is still pushed.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: pr-visualization
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  # The refresh branch's own pull requests are left out of the data, so that
  # merging one is not itself a change worth refreshing.
  BRANCH: automation/pr-visualization

jobs:
  refresh:
    name: Refresh PR visualization
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The script has no dependencies, and prefers the gh CLI, which picks the
      # token up from GH_TOKEN.
      - name: Regenerate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/pr-visualization.mjs --exclude-head-prefix "$BRANCH"

      - name: Commit and open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- docs)" ]; then
            echo "Nothing changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add docs/PR_BRANCH_VISUALIZATION.md docs/pr-branch-visualization.html docs/pr-snapshot.json
          git commit -m "docs: refresh PR snapshot"
          git push --force origin "$BRANCH"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "Pull request already open; the push updated it."
            exit 0
          fi

          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
            --title "docs: refresh PR snapshot" \
            --body "$(cat <<'EOF'
          ## What changed

          Scheduled refresh of the PR ↔ branch visualization: `docs/pr-snapshot.json` is re-read from GitHub, and `docs/PR_BRANCH_VISUALIZATION.md` and `docs/pr-branch-visualization.html` are regenerated from it by `scripts/pr-visualization.mjs`. Opened by `.github/workflows/pr-visualization.yml` because the pull requests or branches differ from the last snapshot.

          ## How it was verified

          Generated by the script from the live GitHub API. Not reviewed by a person and no tests were run: documentation and generated data only, no application code touched. CI does not run on pull requests opened by the workflow's token; see the comment at the top of the workflow.

          ## Notes for review

          - Refresh pull requests (`automation/pr-visualization` branch) are excluded from the data on purpose.
          - Close this pull request to skip a refresh; the next run opens a new one if anything is still out of date.
          EOF
          )"
