version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # One pull request per batch rather than per package. Sixty-odd
    # dependencies opened individually is a queue nobody reads, and the CI and
    # security workflows run on each one.
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Pinned to match patches/wouter@3.7.1.patch. Bumping it makes the patch
      # stop applying and the install fail outright, so the version and the
      # patch have to move together, by hand.
      - dependency-name: wouter

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
