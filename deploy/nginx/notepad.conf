# nginx in front of the Node server, for a VM or any host you run yourself.
# Render and similar platforms already put a proxy in front — you do not need
# this there.
#
# Replace notes.example.com with your domain and the certificate paths with
# your own (certbot writes them to /etc/letsencrypt/live/<domain>/). Then, for
# the Node process:
#
#   PORT=3000                              matches the upstream below
#   PUBLIC_ORIGIN=https://notes.example.com
#   TRUSTED_PROXY_HOPS=1                   nginx is the one hop; add one for a
#                                          CDN in front of nginx
#
# PUBLIC_ORIGIN matters: the server never builds sign-in redirects or email
# links from the Host header, so without it those features cannot work.

upstream notepad {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Only a WebSocket upgrade sends "Upgrade"; every other request gets a
# keepalive connection to the upstream.
# Access logs record the request URI, and a URI can carry a credential: older
# clients put a share-link token in the query string of the WebSocket address.
# Log the path without its query string instead. (`log_format` and `map` live at
# http level; this file is included there.)
map $request_uri $loggable_uri {
    ~^(?<path>[^?]*) $path;
    default          $request_uri;
}

log_format notepad '$remote_addr - [$time_local] "$request_method $loggable_uri" '
                   '$status $body_bytes_sent "$http_user_agent"';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    listen [::]:80;
    server_name notes.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2` works on every nginx; 1.25.1+ prefers a separate
    # `http2 on;` and only warns about this form.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name notes.example.com;

    ssl_certificate     /etc/letsencrypt/live/notes.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notes.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The server accepts JSON bodies up to 25mb (a base64 voice memo is ~22MB);
    # nginx's 1m default would reject them before they arrive.
    access_log /var/log/nginx/notepad.access.log notepad;

    client_max_body_size 25m;

    # Security headers come from the Node server (server/_core/securityHeaders.ts);
    # do not add a second set here, or the browser sees both.

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    # $proxy_add_x_forwarded_for appends the address nginx actually saw to the
    # right of anything the client sent. The server reads from that right-hand
    # end (server/demoLimit.ts), so a forged header cannot pick a rate-limit
    # bucket.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # TLS ends here. Without this the server redirects every request to HTTPS
    # and marks no cookie Secure.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # Real-time collaboration. The server sends no pings, so an idle editor's
    # socket would be cut at nginx's 60s default.
    location = /api/collaborate {
        proxy_pass http://notepad;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://notepad;
    }
}
